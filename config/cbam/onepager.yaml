page:
  title: "Impacts of CBAM on Ukraine & Energy Community Countries: 2026"
  subtitle: "Quantifying the consequences of CBAM for electricity trade between the EU and Energy Community countries with PyPSA"

  key_message_prefix: "Key message:"
  key_message: "Electricity exports from Energy Community countries to the EU could be reduced by over 60%, while markets become fragmeneted with only marginal environmental gains. Rules should be reformed to avoid unintended negative effects."

